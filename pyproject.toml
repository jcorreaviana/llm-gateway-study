[tool.coverage.run]
source = ["gateway", "mock_upstream"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    'if __name__ == "__main__":',
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # linhas longas em dados de teste não são um problema real
