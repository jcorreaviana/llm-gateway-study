# Configuração do gateway. Segredos NÃO ficam aqui: vêm de variáveis de ambiente (.env).
# Campos desconhecidos (ex.: api_key) são rejeitados na inicialização.
gateway:
  port: 8000                      # o bind é sempre 127.0.0.1 (não configurável)
  force_provider_enabled: false   # habilita o header x-gateway-force-provider

# Mock de provedor de mercado (bind sempre em 127.0.0.1)
mock_upstream:
  port: 9001

# Orçamento rígido de chamadas reais (contador persistente, sem reset automático).
# Reset manual: python scripts/reset_budget.py
budget:
  limit: 30
  path: data/budget.json          # relativo à raiz do projeto; ignorado pelo git

# Gravação de cada requisição em JSONL (insumo da Fase 3). Ignorado pelo git.
recorder:
  path: logs/requests.jsonl
  record_content: true            # false: só metadados (sem mensagens nem resposta)

# Ordem de tentativa (nomes de provedores definidos abaixo, sem repetição)
chain: [mock_market, ollama_qwen, ollama_llama]

providers:
  - name: mock_market
    type: mock
    base_url: http://localhost:9001
    model: mock-market-1
    timeout_s: 10
    context_window: 8192
    enabled: true
    rate_limit: {rpm: 5, tpm: null}   # limite baixo de propósito, para a demo; null = sem limite
  - name: anthropic               # fora da chain; a chave vem de ANTHROPIC_API_KEY
    type: anthropic
    # sem base_url: o host da Anthropic é fixo no código (a chave nunca vai para outro destino)
    model: claude-haiku-5-5
    timeout_s: 30
    context_window: 200000
    enabled: false
    real_api_max_input_tokens: 1000   # entrada estimada acima disso -> input_too_large
    max_tokens_cap: 50                # teto de max_tokens por chamada real
  - name: ollama_qwen
    type: ollama
    base_url: http://localhost:11434
    model: qwen2.5:3b
    timeout_s: 120
    # context_window < contexto carregado no Ollama (num_ctx 4096, visto em `ollama ps`): a janela
    # cobre prompt + resposta, e a estimativa chars/4 é aproximada. 3072 deixa ~1024 tokens de
    # margem para a resposta; acima do contexto real o Ollama trunca o prompt em silêncio.
    context_window: 3072
    enabled: true
  - name: ollama_llama
    type: ollama
    base_url: http://localhost:11434
    model: llama3.2:3b
    timeout_s: 120
    context_window: 3072
    enabled: true
