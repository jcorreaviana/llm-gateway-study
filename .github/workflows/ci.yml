name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux exercita o ramo fcntl do lock do budget; Windows, o ramo msvcrt.
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # check_secrets.py --history precisa do histórico completo
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Checar segredos (arquivos e histórico)
        run: python scripts/check_secrets.py --history
      - name: Lint
        run: ruff check .
      - name: Testes com cobertura (sem integração, sem segredos)
        run: pytest --cov
